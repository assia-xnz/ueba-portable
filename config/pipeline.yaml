# Configuration du pipeline UEBA
# ================================
# Ce fichier externalise tous les paramètres ajustables du pipeline,
# afin d'éviter de coder en dur des valeurs métier dans le domaine.

siem:
  # Adapter à utiliser : wazuh | elastic | splunk | qradar
  adapter: wazuh
  # Format du timestamp tel qu'exporté par Kibana Discover
  timestamp_format: "%b %d, %Y @ %H:%M:%S.%f"

windowing:
  # Fenêtres glissantes (sliding windows) pour l'extraction de features
  size_minutes: 60
  step_minutes: 30

baseline:
  # Nombre de jours d'historique utilisés pour construire la baseline par utilisateur
  lookback_days: 7
  # Nombre minimum d'observations requises pour qu'une baseline soit jugée fiable
  min_observations: 5

business_hours:
  # Plage horaire "normale" utilisée pour calculer off_hours_ratio
  start_hour: 8
  end_hour: 18

excluded_accounts:
  # Comptes machine / système à exclure systématiquement (réduction des FP - levier 1)
  suffixes:
    - "$"
  exact_names:
    - "SYSTEM"
    - "LOCAL SERVICE"
    - "NETWORK SERVICE"
    - "ANONYMOUS LOGON"
  prefixes:
    - "DWM-"
    - "UMFD-"

ensemble:
  isolation_forest:
    n_estimators: 200
    random_state: 42
  one_class_svm:
    kernel: rbf
    gamma: scale
  autoencoder:
    hidden_layer_sizes: [8, 4, 8]
    reconstruction_error_percentile: 95
    random_state: 42
  # Nombre minimum de votes "anomalie" parmi les 3 modèles pour déclencher une alerte
  majority_threshold: 2

detection:
  # Réduction des faux positifs (mesurée sur le dataset réel — voir docs/AUDIT.md
  # et scripts/evaluate_fp.py). Ces valeurs sont les défauts de la CLI
  # (`ueba train`/`ueba detect`).
  # default_deny=false : ne plus auto-alerter les utilisateurs sans modèle dédié
  #   (responsable de ~64% des FP, sans gain de recall). FP rate 37.7% -> 13.6%.
  default_deny: false
  # persistence_min_consecutive : n'alerter que sur >=N fenêtres anormales
  #   consécutives (supprime les FP isolés). Combiné -> FP rate 11.1%, recall 100%.
  persistence_min_consecutive: 2

output:
  processed_dir: "data/processed"
  report_filename: "detection_report.json"
